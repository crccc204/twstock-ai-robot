name: Daily TWStock 100K AI Robot v2

on:
  schedule:
    - cron: '55 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 65-Stock T+1 Trigger AI Robot
        run: python robot_engine.py

      - name: Commit updated ledger to docs/
        run: |
          git config user.name "TWStock-AI-Robot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/portfolio_state.json docs/trade_history.csv docs/daily_equity_log.csv
          git diff --staged --quiet || git commit -m "Daily T+1 robot update $(date -u +'%Y-%m-%d')"
          git push
